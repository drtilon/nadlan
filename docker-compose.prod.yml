version: '3.8'

services:
  nginx:
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      # Remove port 443 since we don't use HTTPS
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      - FLASK_ENV=production

  frontend:
    restart: unless-stopped
    environment:
      - NODE_ENV=production
