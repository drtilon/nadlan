version: '3.8'

services:
  # mount the prod‐config + SSL, expose both HTTP+HTTPS
  nginx:
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"

  backend:
    environment:
      - FLASK_ENV=production

  frontend:
    environment:
      - VITE_HOST=0.0.0.0
      - VITE_PORT=3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
