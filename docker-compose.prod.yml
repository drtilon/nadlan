version: '3.8'

services:
  nginx:
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      - FLASK_ENV=production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile  # Force production Dockerfile
    volumes: []  # Remove development volume mounts
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    ports: ["3001:80"]  # Nginx serves on port 80 inside container
