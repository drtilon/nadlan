# Production stack for old.shefaug.com (and other hosts).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  nginx:
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

  backend:
    restart: unless-stopped
    volumes: []  # do not mount source over the image on production
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes: []  # no live source mount — use built static assets
    environment:
      - NODE_ENV=production
    restart: unless-stopped
