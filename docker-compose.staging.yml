version: '3.8'

services:
  nginx:
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

  backend:
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    ports: ["3001:80"]

volumes:
  frontend_node_modules:
