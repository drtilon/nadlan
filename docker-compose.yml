services:
  mysql:
    image: mysql:8.0
    restart: always
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 20s
    networks: [app_network]

  nginx:
    image: nginx:latest
    restart: always
    ports: ["80:80", "443:443"]  # Expose both HTTP and HTTPS
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # Mount SSL certificates
      # Remove default config that interferes
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks: [app_network]

  backend:
    build: ./backend
    ports: ["5001:5001"]
    volumes: ["./backend:/app"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1  # Fix for immediate log output
      - FLASK_ENV=development
    env_file:
      - .env
    networks: [app_network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile       # static build
    ports: ["3001:3001"]            # host 3001 → container 3001 (vite dev) or 80 (nginx prod)
    networks: [app_network]

volumes:
  mysql_data:
  frontend_node_modules:

networks:
  app_network:
    driver: bridge
