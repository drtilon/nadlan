services:
  mysql:
    image: mysql:8.0
    restart: always
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 20s
    networks: [app_network]

  nginx:
    image: nginx:latest
    restart: always
    ports: ["80:80"]  # Only HTTP port needed - Cloudflare handles HTTPS
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # SSL volume removed - Cloudflare handles SSL certificates
    networks: [app_network]

  backend:
    build: ./backend
    ports: ["5001:5001"]
    volumes: ["./backend:/app"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_HOST: mysql
      DB_NAME: mydatabase
      SECRET_KEY: mysecret
    networks: [app_network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile       # static build
    ports: ["3001:80"]             # host 3001 → container 80
    networks: [app_network]

volumes:
  mysql_data:
  frontend_node_modules:

networks:
  app_network:
    driver: bridge
