version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 20s
    networks:
      - app_network
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - app_network

  backend:
    build: ./backend
    container_name: flask_backend
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - FLASK_ENV=development
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_HOST=mysql
      - DB_NAME=mydatabase
      - SECRET_KEY=mysecret
      - CORS_ALLOWED_ORIGINS=http://shefa.com,https://shefa.com,http://localhost,http://localhost:80,http://207.154.221.54:80,http://frontend:80,http://207.154.221.54,http://www.shefaug.com,https://www.shefaug.com,http://localhost:3001,http://207.154.221.54:3001,http://frontend:3001,http://207.154.221.54:3001
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: vite_frontend
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - VITE_HOST=0.0.0.0
      - VITE_PORT=3001
    # Remove the command override to use the Dockerfile CMD
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
