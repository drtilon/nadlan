events {}

http {
    resolver 127.0.0.11 ipv6=off;

    # Global settings for file uploads - INCREASED TIMEOUTS
    client_max_body_size 50M;
    client_body_buffer_size 1M;
    client_body_timeout 600s;     # INCREASED from 60s to 10 minutes
    client_header_timeout 600s;   # INCREASED from 60s to 10 minutes
    send_timeout 600s;            # INCREASED from 60s to 10 minutes

    upstream frontend {
        server frontend:3001;
    }

    upstream backend {
        server backend:5001;
    }

    server {
        listen 80;

        # Handle API requests first
        location /api/ {
            proxy_pass http://backend;  # Already fixed: no trailing /api/
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # File upload settings for API routes
            client_max_body_size 50M;
            client_body_buffer_size 1M;

            # INCREASED Proxy timeout settings for CSV processing
            proxy_connect_timeout 600s;  # INCREASED from 60s to 10 minutes
            proxy_send_timeout 600s;     # INCREASED from 60s to 10 minutes
            proxy_read_timeout 600s;     # INCREASED from 60s to 10 minutes

            # Disable proxy buffering for large uploads
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Handle frontend with SPA routing support
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable error interception for SPA routing
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }

        # Fallback location for SPA routing
        location @spa_fallback {
            proxy_pass http://frontend;  # Fixed: removed trailing /
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
