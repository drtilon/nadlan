events {}

http {
    # Global settings for file uploads - INCREASED TIMEOUTS
    client_max_body_size 50M;
    client_body_buffer_size 1M;
    client_body_timeout 600s;     # INCREASED from 60s to 10 minutes
    client_header_timeout 600s;   # INCREASED from 60s to 10 minutes
    send_timeout 600s;            # INCREASED from 60s to 10 minutes

    upstream frontend {
        server frontend:3001;  # FIXED: Changed from port 80 to 3001
    }

    upstream backend {
        server backend:5001;
    }

    # HTTP server only (Cloudflare handles HTTPS)
    server {
        listen 80;
        server_name shefaug.com www.shefaug.com _;

        # Handle API requests
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;

            # File upload settings for API routes
            client_max_body_size 50M;
            client_body_buffer_size 1M;

            # INCREASED Proxy timeout settings for CSV processing
            proxy_connect_timeout 600s;  # INCREASED from 60s to 10 minutes
            proxy_send_timeout 600s;     # INCREASED from 60s to 10 minutes
            proxy_read_timeout 600s;     # INCREASED from 60s to 10 minutes

            # Disable proxy buffering for large uploads
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Handle frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }

        location @spa_fallback {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://backend/api/health;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
